<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Jamdade Borewells</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#0A2540', accent: '#2563EB', surface: '#0f172a' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Outfit', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-gray-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Abstract Background Blobs -->
    <div class="blob blob-1 !top-[-10%] !left-[-10%] sm:!w-[60vw] sm:!h-[60vw]"></div>
    <div class="blob blob-2 !bottom-[-20%] !right-[-10%] sm:!w-[50vw] sm:!h-[50vw]"></div>

    <!-- Login Container -->
    <div class="w-full max-w-md px-4 relative z-10">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-cyan-500 flex items-center justify-center text-white shadow-lg mx-auto mb-4">
                <i class="ph ph-drop text-4xl"></i>
            </div>
            <h1 class="text-3xl font-display font-bold text-gray-900 dark:text-white tracking-tight">Admin <span class="text-blue-600 dark:text-blue-400">Login</span></h1>
            <p class="text-gray-500 mt-2">Jamdade Borewells Management System</p>
        </div>

        <div class="glass-card rounded-[2rem] p-8 shadow-2xl">
            <form id="login-form" class="space-y-6">
                <!-- Username -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Username</label>
                    <div class="relative">
                        <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="username" required class="input-glass w-full rounded-xl pl-12 pr-4 py-3 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="admin">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
                    <div class="relative">
                        <i class="ph ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="password" required class="input-glass w-full rounded-xl pl-12 pr-4 py-3 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="••••••••">
                    </div>
                </div>

                <!-- Error Message Container -->
                <div id="login-error" class="hidden text-sm font-semibold text-red-500 bg-red-50 dark:bg-red-900/20 p-3 rounded-lg flex items-center gap-2">
                    <i class="ph-fill ph-warning-circle text-lg"></i> <span id="error-text">Invalid credentials</span>
                </div>

                <button type="submit" id="login-btn" class="w-full btn-primary px-8 py-3.5 rounded-xl font-bold flexitems-center justify-center shadow-xl shadow-blue-500/20 transition-all flex items-center gap-2">
                    <span>Sign In to Dashboard</span>
                    <i class="ph ph-arrow-right"></i>
                </button>
            </form>
            
            <div class="mt-8 text-center text-xs text-gray-400 dark:text-gray-500">
                <p>&copy; 2026 Jamdade Borewells. Secure Portal.</p>
                <a href="index.html" class="inline-flex items-center gap-1 mt-2 hover:text-blue-500 transition-colors">
                    <i class="ph ph-arrow-left"></i> Return to Main Website
                </a>
            </div>
        </div>
    </div>

    <script src="assets/js/validate.js"></script>
    <script src="assets/js/api.js"></script>
    <!-- Add temporary fallback script until api.js is fully built -->
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errorDiv = document.getElementById('login-error');
            
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-xl"></i> Authenticating...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            errorDiv.classList.add('hidden');
            
            const formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const req = await fetch('api/login.php', { method: 'POST', body: formData });
                const res = await req.json();
                
                if(res.status === 'success') {
                    btn.innerHTML = '<i class="ph-fill ph-check-circle text-xl"></i> Success!';
                    btn.classList.replace('btn-primary', 'bg-green-500');
                    setTimeout(() => window.location.href = 'admin.html', 800);
                } else {
                    throw new Error(res.message);
                }
            } catch(error) {
                btn.innerHTML = '<span>Sign In to Dashboard</span> <i class="ph ph-arrow-right"></i>';
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                errorDiv.classList.remove('hidden');
                document.getElementById('error-text').innerText = error.message || 'Connection failed.';
            }
        });
    </script>
</body>
</html>
